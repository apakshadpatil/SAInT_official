<!doctype html>
<html lang="en" data-theme="light" data-dashboard-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SAInT — Student Association of Information Technology, JSPM's Rajarshi Shahu College of Engineering" />
    <title>SAInT — Student Association of Information Technology</title>
    <!-- Preconnect to Google Firebase APIs for instantaneous TLS handshake and low query latency -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <script>
      // Restore saved themes before React mounts to avoid flash of unstyled content
      (function() {
        try {
          var t = localStorage.getItem('saint-theme');
          if (t) document.documentElement.setAttribute('data-theme', t);
          var dt = localStorage.getItem('saint-dashboard-theme');
          if (dt) document.documentElement.setAttribute('data-dashboard-theme', dt);
          var dd = localStorage.getItem('saint_doomsday_mode');
          if (dd === 'true') document.documentElement.setAttribute('data-doomsday', 'true');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
